name: Build Windows installer (.exe)

# Runs on every push to main that touches the game; the release tag is v<version from tauri.conf.json>.
# Bump "version" in src-tauri/tauri.conf.json (and package.json) to publish a new release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'src-tauri/**', 'index.html', 'public/**', 'package.json', 'package-lock.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Gravity Is a Liar v__VERSION__'
          releaseBody: |
            ## Install on Windows
            1. Download **Gravity.Is.a.Liar_x.x.x_x64-setup.exe** below.
            2. Run it (if SmartScreen appears: *More info → Run anyway*).
            3. Launch "Gravity Is a Liar" from the Start menu.

            Prefer the browser? Play online: https://firuzdesign32.github.io/gravity-is-a-liar/
          releaseDraft: false
          prerelease: false
