[package]
name = "gravity-is-a-liar"
version = "1.0.0"
description = "Gravity Is a Liar - a platformer where gravity flips when you blink"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
